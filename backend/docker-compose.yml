version: '3.8'

services:
  # Firestore Local Emulator (Optional for offline local development)
  firestore-emulator:
    image: mtlynch/firestore-emulator-docker
    container_name: kizuna-firestore-emulator
    environment:
      - FIRESTORE_PROJECT_ID=kizuna-nihongo-app
      - PORT=8088
    ports:
      - "8088:8088"

  # Spring Boot Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kizuna-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - FIRESTORE_EMULATOR_ENABLED=true
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8088
      - FIREBASE_PROJECT_ID=kizuna-nihongo-app
    depends_on:
      - firestore-emulator
