services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kizuna-backend
    restart: always
    environment:
      - SERVER_PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - KIZUNA_GEMINI_MODEL=${KIZUNA_GEMINI_MODEL:-gemini-3.5-flash-lite}
      - KIZUNA_AI_DAILY_LIMIT=${KIZUNA_AI_DAILY_LIMIT:-100}
    networks:
      - kizuna-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kizuna-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - kizuna-net

networks:
  kizuna-net:
    driver: bridge
