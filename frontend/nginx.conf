server {
    listen 80;
    server_name localhost;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers for Domain Protection
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve APK, ZIP and EXE installer files with download header and mime type
    location ~* \.(apk|zip|exe)$ {
        root /usr/share/nginx/html;
        types {
            application/vnd.android.package-archive apk;
            application/zip zip;
            application/x-msdownload exe;
        }
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Version file for in-app auto update checking
    location = /version.json {
        root /usr/share/nginx/html;
        add_header Content-Type 'application/json' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # React Single Page App (SPA) routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to Spring Boot container
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
