<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="https://i.ibb.co/LDzs5grG/favicon-icon.webp" />
    <link rel="apple-touch-icon" href="https://i.ibb.co/LDzs5grG/favicon-icon.webp" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KIZUNA" />
    <title>KIZUNA - Học Tiếng Nhật Thông Minh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="kizuna-offline-screen" style="display:none; min-height: 100vh; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; box-sizing: border-box; align-items: center; justify-content: center; text-align: center;">
        <div style="max-width: 360px; width: 100%; text-align: center;">
          <div style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 18px; background: #fff1f2; border: 1px solid #ffe4e6; display: flex; align-items: center; justify-content: center;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="1" y1="1" x2="23" y2="23"></line>
              <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
              <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
              <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
              <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
              <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
              <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
          </div>
          <div style="font-size: 11px; font-weight: 900; color: #e11d48; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px;">
            404 • OFFLINE
          </div>
          <h1 style="font-size: 19px; font-weight: 900; color: #0f172a; margin: 0 0 8px;">
            Không có kết nối Internet
          </h1>
          <p style="font-size: 12px; color: #64748b; margin: 0 0 24px; line-height: 1.5;">
            Vui lòng kết nối mạng (Wi-Fi hoặc dữ liệu di động) để tiếp tục sử dụng KIZUNA.
          </p>
          <button onclick="window.location.reload()" style="width: 100%; padding: 13px 16px; background: #0f172a; color: #ffffff; border: none; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer;">
            Thử lại
          </button>
        </div>
      </div>
      <script>
        (function() {
          function checkOffline() {
            var el = document.getElementById('kizuna-offline-screen');
            if (el && !navigator.onLine) {
              el.style.display = 'flex';
            }
          }
          checkOffline();
          window.addEventListener('offline', checkOffline);
          window.addEventListener('online', function() { window.location.reload(); });
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
